<html lang="vi">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0F1F3D',
              cobalt: '#2563EB',
              cobaltLight: '#3B82F6',
              cobaltDark: '#1D4ED8',
              surface: '#F5F8FC',
              card: '#FFFFFF',
              border: '#E2E8F0',
              muted: '#64748B'
            },
            status: {
              success: '#10B981',
              warning: '#F59E0B',
              danger: '#EF4444',
              info: '#06B6D4'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'Be Vietnam Pro', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      background-color: #F5F8FC;
      color: #0F1F3D;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom ultra-clean clinical scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* Transitions */
    .btn-press:active { transform: scale(0.98); }
  </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white bg-[#F5F8FC]">
