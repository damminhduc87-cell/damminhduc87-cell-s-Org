<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F3D" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#3B82F6" stroke-width="6" opacity="0.4" />

  <!-- Medical Cross / QC Pulse Line -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E40AF" stroke-width="12" opacity="0.5" />
  
  <!-- Trend Graph Line (Levey-Jennings) -->
  <path d="M 120 280 L 190 220 L 250 300 L 320 180 L 390 256" fill="none" stroke="url(#blueGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Data Dots -->
  <circle cx="120" cy="280" r="16" fill="#38BDF8" />
  <circle cx="190" cy="220" r="16" fill="#10B981" />
  <circle cx="250" cy="300" r="16" fill="#F59E0B" />
  <circle cx="320" cy="180" r="18" fill="#38BDF8" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="390" cy="256" r="16" fill="#10B981" />

  <!-- Text MD LAB -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MINH DUC LAB</text>
  <text x="256" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="6">QC 2429</text>
</svg>
